<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Chess pawn</title>
  <desc>A dark chess pawn with 3D shading</desc>

  <style>
    .pawn-shadow { fill: #1a1a1a; }
    .pawn-base { fill: #2e2e2e; }
    .pawn-mid { fill: #3a3a3a; }
    .pawn-light { fill: #555; }
    .pawn-highlight { fill: #777; }
    .pawn-head { fill: #2e2e2e; }
  </style>

  <g transform="translate(340,260)">

    <!-- Shadow ellipse on ground -->
    <ellipse cx="0" cy="215" rx="72" ry="14" fill="#111" opacity="0.7"/>

    <!-- Base platform -->
    <path d="M-68 200 Q-72 215 0 215 Q72 215 68 200 L58 185 Q30 190 0 190 Q-30 190 -58 185 Z" class="pawn-base"/>
    <path d="M-58 185 Q-30 190 0 190 Q30 190 58 185 L50 178 Q25 183 0 183 Q-25 183 -50 178 Z" class="pawn-mid"/>
    <path d="M-50 178 Q-25 183 0 183 Q25 183 50 178 L44 172 Q22 176 0 176 Q-22 176 -44 172 Z" class="pawn-light"/>

    <!-- Stem -->
    <path d="M-44 172 Q-22 176 0 176 Q22 176 44 172 L38 110 Q18 112 0 112 Q-18 112 -38 110 Z" class="pawn-base"/>
    <path d="M-44 172 L-38 110 Q-28 113 -20 113 L-26 172 Z" class="pawn-mid" opacity="0.8"/>
    <path d="M44 172 L38 110 Q28 113 20 113 L26 172 Z" class="pawn-shadow" opacity="0.6"/>

    <!-- Collar ring -->
    <ellipse cx="0" cy="110" rx="38" ry="9" class="pawn-base"/>
    <path d="M-38 110 Q0 102 38 110 Q0 118 -38 110 Z" class="pawn-light" opacity="0.5"/>

    <!-- Body bulge -->
    <ellipse cx="0" cy="62" rx="52" ry="48" class="pawn-base"/>
    <ellipse cx="-16" cy="48" rx="22" ry="20" class="pawn-mid" opacity="0.6"/>
    <ellipse cx="-8" cy="38" rx="14" ry="10" class="pawn-light" opacity="0.4"/>
    <path d="M30 40 Q52 60 48 85 Q44 100 30 108 Q46 92 46 68 Q46 50 30 40 Z" class="pawn-shadow" opacity="0.5"/>

    <!-- Neck -->
    <ellipse cx="0" cy="14" rx="20" ry="8" class="pawn-base"/>

    <!-- Head sphere -->
    <circle cx="0" cy="-22" r="34" class="pawn-base"/>
    <ellipse cx="-10" cy="-34" rx="16" ry="13" class="pawn-mid" opacity="0.6"/>
    <ellipse cx="-6" cy="-48" rx="10" ry="7" class="pawn-light" opacity="0.5"/>
    <path d="M20 -38 Q34 -22 30 -4 Q26 8 16 14 Q28 6 30 -10 Q32 -26 20 -38 Z" class="pawn-shadow" opacity="0.45"/>

  </g>
</svg>